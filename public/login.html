<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — Drizzle Todo</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, sans-serif;
        max-width: 380px;
        margin: 4rem auto;
        padding: 0 1rem;
      }
      h1 { margin-bottom: 0.25rem; }
      .hint { font-size: 0.85rem; opacity: 0.7; margin-bottom: 1.25rem; }
      .tabs { display: flex; gap: 0.25rem; margin-bottom: 1rem; }
      .tabs button {
        flex: 1;
        padding: 0.5rem;
        background: transparent;
        border: 1px solid #8884;
        cursor: pointer;
      }
      .tabs button.active { background: #8884; }
      form { display: flex; flex-direction: column; gap: 0.5rem; }
      label { font-size: 0.85rem; opacity: 0.8; }
      input { padding: 0.5rem; font-size: 1rem; }
      button[type="submit"] {
        margin-top: 0.5rem;
        padding: 0.6rem;
        font-size: 1rem;
        cursor: pointer;
      }
      .error { color: #c33; font-size: 0.9rem; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <h1>Sign in</h1>
    <p class="hint">Drizzle Todo — auth demo.</p>

    <div class="tabs">
      <button id="tab-login" class="active" type="button">Sign in</button>
      <button id="tab-register" type="button">Register</button>
    </div>

    <form id="form">
      <div id="name-row" hidden>
        <label for="name">Name</label>
        <input id="name" type="text" autocomplete="name" />
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required minlength="4" />
      <button type="submit" id="submit">Sign in</button>
      <div class="error" id="error"></div>
    </form>

    <script type="module">
      import { gql, setToken, redirectIfAuth } from "/app.js";

      await redirectIfAuth();

      const tabLogin = document.getElementById("tab-login");
      const tabRegister = document.getElementById("tab-register");
      const nameRow = document.getElementById("name-row");
      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const submit = document.getElementById("submit");
      const errorEl = document.getElementById("error");
      const form = document.getElementById("form");

      let mode = "login";

      function setMode(next) {
        mode = next;
        const isLogin = mode === "login";
        tabLogin.classList.toggle("active", isLogin);
        tabRegister.classList.toggle("active", !isLogin);
        nameRow.hidden = isLogin;
        nameInput.required = !isLogin;
        passwordInput.autocomplete = isLogin ? "current-password" : "new-password";
        submit.textContent = isLogin ? "Sign in" : "Create account";
        errorEl.textContent = "";
      }
      tabLogin.onclick = () => setMode("login");
      tabRegister.onclick = () => setMode("register");

      form.onsubmit = async (e) => {
        e.preventDefault();
        errorEl.textContent = "";
        submit.disabled = true;
        try {
          const variables = {
            email: emailInput.value.trim(),
            password: passwordInput.value,
          };
          let data;
          if (mode === "login") {
            data = await gql(
              `mutation($email: String!, $password: String!) {
                 login(email: $email, password: $password) { token user { id name } }
               }`,
              variables,
            );
            setToken(data.login.token);
          } else {
            variables.name = nameInput.value.trim();
            data = await gql(
              `mutation($name: String!, $email: String!, $password: String!) {
                 register(name: $name, email: $email, password: $password) { token user { id name } }
               }`,
              variables,
            );
            setToken(data.register.token);
          }
          window.location.replace("/");
        } catch (err) {
          errorEl.textContent = err.message;
        } finally {
          submit.disabled = false;
        }
      };
    </script>
  </body>
</html>
